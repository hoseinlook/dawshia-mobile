name: Release

# Builds the apps and publishes them on GitHub Releases.
#  - every push to master/main → Android APK on the rolling pre-release "Latest build"
#    (tag `latest-build`, asset `dawshia-latest.apk`)
#  - every version tag (git tag v0.1.0 && git push origin v0.1.0) → a versioned release
#    with the Android APK and the iOS IPA
#  - "Run workflow" in the Actions tab → both apps on "Latest build"
#
# iOS runs on macOS runners, which cost 10× Actions minutes on private repos,
# so it only builds for tags and manual runs.
on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write # create releases, move the latest-build tag, upload assets

concurrency:
  # A newer push replaces an unfinished build of the same branch; tag builds always finish.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Asset names: dawshia-v1.2.3.apk / .ipa for tags, dawshia-latest.* otherwise.
  LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads between runs. (setup-java's own Gradle cache can't be used:
      # the android/ project only exists after `expo prebuild`.)
      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Run checks
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Set version
        run: node scripts/ci/set-version.js

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        # With the ANDROID_KEYSTORE_* secrets, the APK is signed with your release key.
        # Without them it keeps the template's debug signature (same as local builds).
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT="dawshia-${LABEL}.apk"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set — publishing a debug-signed APK."
            cp "$APK" "$OUT"
          else
            BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "$OUT" aligned.apk
            "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
            rm -f release.keystore aligned.apk
          fi
          ls -la "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dawshia-*.apk
          retention-days: 14

  ios:
    name: iOS IPA
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set version
        run: node scripts/ci/set-version.js

      - name: Generate native project (and install CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Build IPA
        # Unsigned without these secrets (install with Sideloadly/AltStore); signed with them.
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: scripts/ci/build-ios.sh "dawshia-${LABEL}.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dawshia-*.ipa
          retention-days: 14

  publish:
    name: Publish release
    needs: [android, ios]
    # Publish whatever was built: Android is required; iOS is attached when it was built.
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Move the latest-build tag to this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin refs/tags/latest-build

      - name: Publish "Latest build" pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: Latest build (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*
          body: |
            Automatic build of `${{ github.ref_name }}` at ${{ github.sha }} (run #${{ github.run_number }}).
            - **Android:** download `dawshia-latest.apk` and open it on your phone.
            - **iOS** (manual runs only): `dawshia-latest.ipa` — see the README for installing it.

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            - **Android:** `dawshia-${{ github.ref_name }}.apk` — open it on your phone to install or update.
            - **iOS:** `dawshia-${{ github.ref_name }}.ipa` — unsigned unless iOS signing secrets are set; install with Sideloadly or AltStore (see the README).
